# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false
# Pin the Gradle daemon to JDK 21 (this machine's default JDK is newer than Loom supports).
# Forward slashes are required even on Windows. On a machine where JDK 21 is already the default,
# delete this line or move it to ~/.gradle/gradle.properties so the repo stays portable.
org.gradle.java.home=C:/Program Files/Java/jdk-21

# Fabric Loader (shared across all Minecraft versions; forward-compatible)
loader_version=0.18.4

# Mod identity (shared across all versions)
mod_version=1.0.0
maven_group=dev.kui
archives_base_name=kui

# ---------------------------------------------------------------------------
# Defaults for the 1.21.11 target. Each other target overrides these in
# versions/<mc>/gradle.properties.
# ---------------------------------------------------------------------------
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
fabric_version=0.140.2+1.21.11

# Range written into fabric.mod.json's minecraft dependency.
minecraft_dep=>=1.21.11 <1.22
